# ---------------------------------------------------------------- Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------- Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.builder.sdkDownload=true

# ---------------------------------------------------------------- Uygulama
# Play Store'a her yüklemede versionCode ARTIRILMALIDIR.
appVersionCode=3
appVersionName=2.22.0

# Uygulamanın açacağı adres ve paket adı.
# Adres değişirse yalnızca twaUrl; paket değişirse twaPackage güncellenmelidir.
# Paket adı değişirse Java kaynaklarındaki paket satırları da güncellenmelidir.
twaUrl=https://ddproje.vercel.app/
twaPackage=com.mabiltekin.deneyapevkoruma
