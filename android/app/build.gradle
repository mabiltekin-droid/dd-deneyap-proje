plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Bu değerler android/gradle.properties dosyasından gelir; web adresi, paket adı
// ve sürüm değişince yalnızca orayı düzenlemek yeterlidir.
def appStartUrl = project.findProperty('twaUrl') ?: 'https://ddproje.vercel.app/'
def appPackage = project.findProperty('twaPackage') ?: 'com.mabiltekin.deneyapevkoruma'
def appVersionName = project.findProperty('appVersionName') ?: '2.21.0'
def appVersionCode = (project.findProperty('appVersionCode') ?: '2').toString().toInteger()

android {
    namespace appPackage
    compileSdk 36

    defaultConfig {
        applicationId appPackage
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
        resValue "string", "start_url", appStartUrl
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Custom Tabs (Chrome'da açma) ve WebView yedeği.
    implementation 'androidx.browser:browser:1.8.0'
}
